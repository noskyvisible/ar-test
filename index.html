<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            pointer-events: none;
        }
        
        #header {
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.4), transparent);
            pointer-events: auto;
        }
        
        #header h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        #status {
            padding: 10px 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.4;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        #status.error {
            background: rgba(220, 38, 38, 0.4);
            border: 1px solid rgba(220, 38, 38, 0.6);
        }
        
        #status.success {
            background: rgba(34, 197, 94, 0.3);
            border: 1px solid rgba(34, 197, 94, 0.5);
        }
        
        #controls {
            margin-top: auto;
            padding: 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.6), transparent);
            pointer-events: auto;
        }
        
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        
        .btn-row:last-child {
            margin-bottom: 0;
        }
        
        .btn {
            flex: 1;
            min-width: 70px;
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        
        .btn-primary:not(:disabled):active {
            transform: scale(0.96);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        
        .btn-secondary:not(:disabled):active {
            background: rgba(255,255,255,0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }
        
        .btn-danger {
            background: rgba(220, 38, 38, 0.8);
            color: white;
        }
        
        #fileInput {
            display: none;
        }
        
        #startScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 30px;
            text-align: center;
        }
        
        #startScreen h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        #startScreen p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 24px;
            max-width: 280px;
            line-height: 1.5;
            font-size: 14px;
        }
        
        #startScreen .btn {
            width: 100%;
            max-width: 260px;
            padding: 16px 20px;
            font-size: 15px;
            margin-bottom: 10px;
        }
        
        #deviceInfo {
            margin-top: 20px;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            text-align: left;
            width: 100%;
            max-width: 280px;
            font-family: monospace;
            line-height: 1.5;
        }
        
        .hidden {
            display: none !important;
        }
        
        canvas {
            position: fixed;
            inset: 0;
            touch-action: none;
        }
        
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.7;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 2px;
        }
        
        #crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }
        
        #crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }
        
        #modeIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 30px;
            background: rgba(0,0,0,0.8);
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            z-index: 150;
            pointer-events: none;
        }
        
        #modeIndicator.fade-out {
            animation: fadeOut 0.5s forwards;
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen">
        <h1>🔮 AR Model Viewer</h1>
        <p>Place 3D models in augmented reality or use 3D preview mode</p>
        
        <button class="btn btn-primary" id="startARBtn">
            📱 Start AR Session
        </button>
        
        <button class="btn btn-secondary" id="start3DBtn">
            🖥️ 3D Preview Mode
        </button>
        
        <div id="deviceInfo">Checking device...</div>
    </div>
    
    <!-- Mode indicator -->
    <div id="modeIndicator" class="hidden"></div>
    
    <!-- Crosshair for 3D mode -->
    <div id="crosshair" class="hidden"></div>
    
    <!-- AR Overlay UI -->
    <div id="overlay" class="hidden">
        <div id="header">
            <h1>AR Model Viewer</h1>
            <div id="status">Initializing...</div>
        </div>
        
        <div id="controls">
            <div class="btn-row">
                <button class="btn btn-success" id="useCubeBtn">
                    🎁 Use Demo Cube
                </button>
                <button class="btn btn-primary" id="loadBtn">
                    📁 Load GLB/GLTF
                </button>
            </div>
            <div class="btn-row">
                <button class="btn btn-secondary" id="placeBtn" disabled>
                    📍 Place Model
                </button>
                <button class="btn btn-secondary" id="rotateBtn" disabled>
                    🔄 Rotate
                </button>
            </div>
            <div class="btn-row">
                <button class="btn btn-secondary" id="scaleUpBtn" disabled>
                    ➕ Bigger
                </button>
                <button class="btn btn-secondary" id="scaleDownBtn" disabled>
                    ➖ Smaller
                </button>
                <button class="btn btn-secondary" id="removeBtn" disabled>
                    🗑️ Remove
                </button>
            </div>
            <div class="btn-row">
                <button class="btn btn-danger" id="exitBtn">
                    ✕ Exit
                </button>
            </div>
        </div>
    </div>
    
    <input type="file" id="fileInput" accept=".glb,.gltf">

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ============================================
        // STATE
        // ============================================
        let renderer, scene, camera, controls;
        let xrSession = null;
        let xrRefSpace = null;
        let xrHitTestSource = null;
        
        let reticle = null;
        let reticleVisible = false;
        
        let loadedModel = null;
        let placedModels = [];
        let modelScale = 0.3;
        
        let isARMode = false;
        let is3DMode = false;
        
        const gltfLoader = new GLTFLoader();
        
        // ============================================
        // DOM ELEMENTS
        // ============================================
        const startScreen = document.getElementById('startScreen');
        const startARBtn = document.getElementById('startARBtn');
        const start3DBtn = document.getElementById('start3DBtn');
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status');
        const deviceInfo = document.getElementById('deviceInfo');
        const fileInput = document.getElementById('fileInput');
        const loadBtn = document.getElementById('loadBtn');
        const useCubeBtn = document.getElementById('useCubeBtn');
        const placeBtn = document.getElementById('placeBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const removeBtn = document.getElementById('removeBtn');
        const exitBtn = document.getElementById('exitBtn');
        const scaleUpBtn = document.getElementById('scaleUpBtn');
        const scaleDownBtn = document.getElementById('scaleDownBtn');
        const crosshair = document.getElementById('crosshair');
        const modeIndicator = document.getElementById('modeIndicator');
        
        // ============================================
        // LOGGING
        // ============================================
        const logs = [];
        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${msg}`;
            logs.push(entry);
            console.log(entry);
            
            const displayLogs = logs.slice(-8);
            status.textContent = displayLogs.join('\n');
            
            status.classList.remove('error', 'success');
            if (type === 'error') status.classList.add('error');
            if (type === 'success') status.classList.add('success');
        }
        
        function showModeIndicator(text, duration = 2000) {
            modeIndicator.textContent = text;
            modeIndicator.classList.remove('hidden', 'fade-out');
            setTimeout(() => {
                modeIndicator.classList.add('fade-out');
                setTimeout(() => modeIndicator.classList.add('hidden'), 500);
            }, duration);
        }
        
        // ============================================
        // DEVICE CHECK
        // ============================================
        async function checkXRSupport() {
            const info = [];
            
            info.push(`Platform: ${navigator.platform}`);
            
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari')) browser = 'Safari';
            info.push(`Browser: ${browser}`);
            
            if (!navigator.xr) {
                info.push('❌ WebXR: NOT AVAILABLE');
                info.push('');
                info.push('Use "3D Preview Mode" instead');
                deviceInfo.innerHTML = info.join('<br>');
                startARBtn.disabled = true;
                startARBtn.innerHTML = '❌ AR Not Available';
                return false;
            }
            
            info.push('✅ WebXR: Available');
            
            try {
                const arSupported = await navigator.xr.isSessionSupported('immersive-ar');
                if (arSupported) {
                    info.push('✅ AR Mode: Supported');
                } else {
                    info.push('❌ AR Mode: Not Supported');
                    info.push('');
                    info.push('Use "3D Preview Mode" instead');
                    startARBtn.disabled = true;
                    startARBtn.innerHTML = '❌ AR Not Supported';
                }
            } catch (e) {
                info.push(`❌ AR Check Error: ${e.message}`);
                startARBtn.disabled = true;
            }
            
            deviceInfo.innerHTML = info.join('<br>');
            return true;
        }
        
        // ============================================
        // THREE.JS SETUP
        // ============================================
        function initThreeJS(forAR = false) {
            // Scene
            scene = new THREE.Scene();
            if (!forAR) {
                scene.background = new THREE.Color(0x1a1a2e);
            }
            
            // Camera
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
            if (!forAR) {
                camera.position.set(0, 1.5, 3);
            }
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            
            if (forAR) {
                renderer.xr.enabled = true;
            }
            
            // Remove old canvas if exists
            const oldCanvas = document.querySelector('canvas');
            if (oldCanvas) oldCanvas.remove();
            
            document.body.insertBefore(renderer.domElement, document.body.firstChild);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);
            
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(hemiLight);
            
            // Add ground plane for 3D mode
            if (!forAR) {
                const gridHelper = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
                scene.add(gridHelper);
                
                // Orbit controls
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.target.set(0, 0, 0);
            }
            
            // Create reticle for AR
            if (forAR) {
                createReticle();
            }
            
            log('Three.js initialized');
        }
        
        function createReticle() {
            const geometry = new THREE.RingGeometry(0.06, 0.08, 32);
            geometry.rotateX(-Math.PI / 2);
            
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            
            reticle = new THREE.Mesh(geometry, material);
            reticle.visible = false;
            reticle.matrixAutoUpdate = false;
            scene.add(reticle);
            
            // Inner dot
            const dotGeometry = new THREE.CircleGeometry(0.02, 16);
            dotGeometry.rotateX(-Math.PI / 2);
            const dotMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88,
                transparent: true,
                opacity: 0.9
            });
            const dot = new THREE.Mesh(dotGeometry, dotMaterial);
            dot.position.y = 0.001;
            reticle.add(dot);
        }
        
        // ============================================
        // CREATE DEMO CUBE
        // ============================================
        function createDemoCube() {
            const group = new THREE.Group();
            
            // Main cube
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const material = new THREE.MeshStandardMaterial({
                color: 0x4488ff,
                metalness: 0.3,
                roughness: 0.4
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.1;
            group.add(cube);
            
            // Add colored edges
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            wireframe.position.y = 0.1;
            group.add(wireframe);
            
            loadedModel = group;
            log('✅ Demo cube ready - tap Place Model', 'success');
            placeBtn.disabled = false;
        }
        
        // ============================================
        // AR SESSION
        // ============================================
        async function startAR() {
            log('Requesting AR session...');
            
            try {
                initThreeJS(true);
                
                // Request AR session
                const sessionInit = {
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['dom-overlay', 'local-floor'],
                    domOverlay: { root: overlay }
                };
                
                log('Calling requestSession...');
                xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
                log('✅ AR session created!', 'success');
                
                isARMode = true;
                
                xrSession.addEventListener('end', onSessionEnd);
                
                // Set up renderer
                await renderer.xr.setSession(xrSession);
                log('Renderer XR session set');
                
                // Get reference space
                try {
                    xrRefSpace = await xrSession.requestReferenceSpace('local-floor');
                    log('Using local-floor space');
                } catch (e) {
                    xrRefSpace = await xrSession.requestReferenceSpace('local');
                    log('Using local space (fallback)');
                }
                
                // Set up hit testing
                try {
                    const viewerSpace = await xrSession.requestReferenceSpace('viewer');
                    xrHitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
                    log('✅ Hit-test ready', 'success');
                } catch (e) {
                    log('⚠️ Hit-test failed: ' + e.message, 'error');
                }
                
                // Handle select events
                xrSession.addEventListener('select', onARSelect);
                
                // Start render loop
                renderer.setAnimationLoop(onXRFrame);
                
                // Update UI
                startScreen.classList.add('hidden');
                overlay.classList.remove('hidden');
                
                showModeIndicator('AR Mode Active\nPoint camera at floor');
                log('🎯 Point at a surface, then Place', 'success');
                
            } catch (err) {
                log(`❌ AR Error: ${err.message}`, 'error');
                console.error('Full error:', err);
                
                // Show detailed error
                if (err.name === 'NotSupportedError') {
                    log('AR not supported on this device/browser', 'error');
                } else if (err.name === 'SecurityError') {
                    log('AR requires HTTPS', 'error');
                }
            }
        }
        
        // ============================================
        // 3D PREVIEW MODE
        // ============================================
        function start3DMode() {
            log('Starting 3D Preview Mode...');
            
            initThreeJS(false);
            
            is3DMode = true;
            
            // Start render loop
            function animate() {
                requestAnimationFrame(animate);
                if (controls) controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            // Update UI
            startScreen.classList.add('hidden');
            overlay.classList.remove('hidden');
            crosshair.classList.remove('hidden');
            placeBtn.textContent = '📍 Place at Center';
            
            showModeIndicator('3D Preview Mode\nUse touch to orbit');
            log('✅ 3D mode ready', 'success');
        }
        
        // ============================================
        // SESSION END
        // ============================================
        function onSessionEnd() {
            log('Session ended');
            xrSession = null;
            xrHitTestSource = null;
            xrRefSpace = null;
            isARMode = false;
            is3DMode = false;
            
            startScreen.classList.remove('hidden');
            overlay.classList.add('hidden');
            crosshair.classList.add('hidden');
            
            renderer.setAnimationLoop(null);
            
            // Reset state
            loadedModel = null;
            placedModels = [];
            placeBtn.disabled = true;
        }
        
        function exitSession() {
            if (xrSession) {
                xrSession.end();
            } else {
                onSessionEnd();
            }
        }
        
        // ============================================
        // XR FRAME LOOP
        // ============================================
        function onXRFrame(time, frame) {
            if (!frame) return;
            
            // Update hit test
            if (xrHitTestSource && xrRefSpace) {
                const hitTestResults = frame.getHitTestResults(xrHitTestSource);
                
                if (hitTestResults.length > 0) {
                    const hit = hitTestResults[0];
                    const pose = hit.getPose(xrRefSpace);
                    
                    if (pose && reticle) {
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        reticleVisible = true;
                    }
                } else {
                    if (reticle) reticle.visible = false;
                    reticleVisible = false;
                }
            }
            
            renderer.render(scene, camera);
        }
        
        // ============================================
        // MODEL PLACEMENT
        // ============================================
        function onARSelect(event) {
            // This fires when user taps in AR
            log('Screen tap detected');
            
            if (loadedModel && reticleVisible) {
                placeModelAtReticle();
            }
        }
        
        function placeModel() {
            if (!loadedModel) {
                log('Load a model first!');
                return;
            }
            
            if (isARMode) {
                if (!reticleVisible) {
                    log('Point at a surface first');
                    return;
                }
                placeModelAtReticle();
            } else {
                // 3D mode - place at center
                placeModelAt3DCenter();
            }
        }
        
        function placeModelAtReticle() {
            const clone = loadedModel.clone();
            clone.position.setFromMatrixPosition(reticle.matrix);
            
            scene.add(clone);
            placedModels.push(clone);
            
            log(`✅ Placed! (${placedModels.length} total)`, 'success');
            updateControlButtons();
        }
        
        function placeModelAt3DCenter() {
            const clone = loadedModel.clone();
            clone.position.set(0, 0, 0);
            
            scene.add(clone);
            placedModels.push(clone);
            
            log(`✅ Placed! (${placedModels.length} total)`, 'success');
            updateControlButtons();
        }
        
        // ============================================
        // MODEL LOADING
        // ============================================
        async function loadModel(file) {
            log(`Loading: ${file.name}...`);
            
            try {
                const url = URL.createObjectURL(file);
                const gltf = await gltfLoader.loadAsync(url);
                URL.revokeObjectURL(url);
                
                const model = gltf.scene;
                
                // Normalize scale
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = modelScale / maxDim;
                model.scale.setScalar(scale);
                
                // Center and ground
                model.position.set(
                    -center.x * scale,
                    -box.min.y * scale,
                    -center.z * scale
                );
                
                // Wrap in group
                const wrapper = new THREE.Group();
                wrapper.add(model);
                
                loadedModel = wrapper;
                
                log(`✅ "${file.name}" loaded`, 'success');
                placeBtn.disabled = false;
                
            } catch (err) {
                log(`❌ Load failed: ${err.message}`, 'error');
            }
        }
        
        // ============================================
        // MODEL MANIPULATION
        // ============================================
        function rotateLastModel() {
            if (placedModels.length === 0) return;
            const model = placedModels[placedModels.length - 1];
            model.rotation.y += Math.PI / 4;
            log('Rotated 45°');
        }
        
        function removeLastModel() {
            if (placedModels.length === 0) return;
            const model = placedModels.pop();
            scene.remove(model);
            log(`Removed (${placedModels.length} left)`);
            updateControlButtons();
        }
        
        function scaleUp() {
            modelScale = Math.min(modelScale * 1.5, 2.0);
            log(`Scale: ${(modelScale * 100).toFixed(0)}%`);
            if (loadedModel) loadedModel.scale.multiplyScalar(1.5);
        }
        
        function scaleDown() {
            modelScale = Math.max(modelScale / 1.5, 0.05);
            log(`Scale: ${(modelScale * 100).toFixed(0)}%`);
            if (loadedModel) loadedModel.scale.multiplyScalar(1/1.5);
        }
        
        function updateControlButtons() {
            const hasPlaced = placedModels.length > 0;
            rotateBtn.disabled = !hasPlaced;
            removeBtn.disabled = !hasPlaced;
            scaleUpBtn.disabled = !loadedModel;
            scaleDownBtn.disabled = !loadedModel;
        }
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        startARBtn.addEventListener('click', startAR);
        start3DBtn.addEventListener('click', start3DMode);
        exitBtn.addEventListener('click', exitSession);
        
        useCubeBtn.addEventListener('click', createDemoCube);
        loadBtn.addEventListener('click', () => fileInput.click());
        placeBtn.addEventListener('click', placeModel);
        rotateBtn.addEventListener('click', rotateLastModel);
        removeBtn.addEventListener('click', removeLastModel);
        scaleUpBtn.addEventListener('click', scaleUp);
        scaleDownBtn.addEventListener('click', scaleDown);
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadModel(file);
            fileInput.value = '';
        });
        
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        // ============================================
        // INIT
        // ============================================
        checkXRSupport();
    </script>
</body>
</html>
